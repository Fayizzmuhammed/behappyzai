  <script>
    let isRedirecting = false;

    // Reset button state whenever user returns to the page (Back button / bfcache / tab switch)

      isRedirecting = false;
      document.body.classList.remove("redirect-active");
    }

    // Handles browser Back-Forward cache (bfcache) restore
    window.addEventListener("pageshow", function () {
      resetButtonState();

      if (isRedirecting) return;
      isRedirecting = true;

      document.body.classList.add("redirect-active");

      // 1. Dispatch Meta Pixel Lead & Custom Click event
      if (typeof fbq === "function") {

      // 2. Auto-reset lock after 1 second so button is immediately clickable again if user returns
      setTimeout(resetButtonState, 1000);

      // 3. Ultra-fast redirect (25ms ensures event is queued by browser network stack while feeling instantaneous)
      setTimeout(function () {
        window.location.href = targetUrl;
      }, 25);
    }
